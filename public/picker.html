<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Office Picker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .tools button,
      .tools select,
      .tools label.file {
        font: 600 12px var(--mono);
        color: var(--text);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
      }
      .tools button.on {
        border-color: var(--gold);
        color: var(--gold);
      }
      .wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 14px;
        padding: 14px;
      }
      @media (max-width: 900px) {
        .wrap {
          grid-template-columns: 1fr;
        }
      }
      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1448 / 1086;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
      }
      .board > img,
      .board > canvas,
      .board > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .card h3 {
        margin: 0 0 6px;
        font: 12px var(--display);
      }
      .check li {
        list-style: none;
        margin: 2px 0;
      }
      .check .ok {
        color: var(--ok);
      }
      .check .bad {
        color: var(--bad);
      }
      .help {
        color: var(--muted);
      }
      #msg {
        color: var(--gold);
        font: 12px var(--mono);
      }
    </style>
  </head>
  <body>
    <header class="hud">
      <div class="brand">Office Picker</div>
      <div class="tools" id="modes"></div>
      <select id="room"></select>
      <select id="office" aria-label="Peta yang disunting"></select>
      <div class="spacer"></div>
      <div class="tools">
        <button id="undo">Undo</button>
        <button id="save">Simpan</button>
        <button id="download">Unduh JSON</button>
        <label class="file">Impor <input type="file" id="import" accept="application/json" hidden /></label>
        <a class="btn" href="/">Kantor</a>
      </div>
    </header>
    <div class="wrap">
      <div class="board" id="board"><svg id="overlay" viewBox="0 0 1448 1086"></svg></div>
      <aside class="side">
        <div class="card help" id="help"></div>
        <div class="card"><h3>Checklist</h3><ul class="check" id="check"></ul></div>
        <div id="msg"></div>
      </aside>
    </div>
    <script type="module" src="/picker.js"></script>
  </body>
</html>
